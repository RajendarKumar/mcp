[project]
name = "mcp-demo"
version = "0.1.0"
description = "A small, hands-on example of MCP tools, resources, and prompts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
